<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="60%" stop-color="#1c0505"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="glow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#mbg)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Sharingan Eye -->
  <g transform="translate(100, 92)" filter="url(#glow-m)">
    <!-- Outer Eye Rim -->
    <circle cx="0" cy="0" r="42" fill="url(#iris)" stroke="#450a0a" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#000000" stroke-width="1.2" opacity="0.6"/>
    <!-- Central Pupil -->
    <circle cx="0" cy="0" r="8" fill="#000000"/>
    <!-- Madara EMS Pattern (3 interconnected thick crescent blades) -->
    <path d="M0 -30 C12 -20 22 -6 24 8 C16 4 8 2 0 8 C6 -4 4 -16 0 -30 Z" fill="#000000"/>
    <path d="M0 -30 C12 -20 22 -6 24 8 C16 4 8 2 0 8 C6 -4 4 -16 0 -30 Z" fill="#000000" transform="rotate(120)"/>
    <path d="M0 -30 C12 -20 22 -6 24 8 C16 4 8 2 0 8 C6 -4 4 -16 0 -30 Z" fill="#000000" transform="rotate(240)"/>
    <circle cx="-1" cy="-1" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>
  <text x="100" y="165" text-anchor="middle" fill="#ef4444" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MADARA UCHIHA</text>
  <text x="100" y="180" text-anchor="middle" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1">GHOST OF THE UCHIHA</text>
</svg>
