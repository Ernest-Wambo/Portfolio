<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="tbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#0c0702"/>
    </radialGradient>
    <filter id="glow-t" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#tbg)" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Crosshairs / Imperial Badge -->
  <g transform="translate(100, 92)" filter="url(#glow-t)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <line x1="-48" y1="0" x2="-24" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <line x1="24" y1="0" x2="48" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <line x1="0" y1="-48" x2="0" y2="-24" stroke="#f59e0b" stroke-width="2"/>
    <line x1="0" y1="24" x2="0" y2="48" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,-10 8,0 0,10 -8,0" fill="#ef4444"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <text x="100" y="165" text-anchor="middle" fill="#fb923c" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">TANYA DEGURECHAFF</text>
  <text x="100" y="180" text-anchor="middle" fill="#ea580c" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1">DEVIL OF THE RHINE</text>
</svg>
