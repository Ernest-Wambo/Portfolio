<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="vbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="glow-v" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#vbg)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Saiyan Royal Crest / Majin M Sigil -->
  <g transform="translate(100, 90)" filter="url(#glow-v)">
    <!-- Aura Flames -->
    <path d="M-30 20 C-40 -10 -25 -35 0 -45 C25 -35 40 -10 30 20 C15 30 -15 30 -30 20 Z" fill="#fbbf24" opacity="0.15"/>
    <path d="M-22 15 C-28 -5 -18 -25 0 -35 C18 -25 28 -5 22 15 C10 22 -10 22 -22 15 Z" fill="#f59e0b" opacity="0.25"/>
    <!-- The Iconic Sharp 'M' of Babidi's seal broken by sheer Saiyan Pride -->
    <path d="M-34 16 L-24 -24 L-12 2 L0 -18 L12 2 L24 -24 L34 16 L22 16 L14 -4 L0 18 L-14 -4 L-22 16 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <!-- Royal Saiyan Sunburst / Stars -->
    <circle cx="0" cy="-28" r="3" fill="#ffffff"/>
    <circle cx="-16" cy="-30" r="1.5" fill="#fde68a"/>
    <circle cx="16" cy="-30" r="1.5" fill="#fde68a"/>
  </g>
  <text x="100" y="165" text-anchor="middle" fill="#fbbf24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">PRINCE VEGETA</text>
  <text x="100" y="180" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1">PRIDE OF ALL SAIYANS</text>
</svg>
